name: mkef

services:
  solver:
    image: denisovds/mkef-solver:0.8.2
    pull_policy: always
    environment:
      MKEF_ALLOWED_ORIGINS: "http://localhost:${MKEF_PORT:-8080},http://127.0.0.1:${MKEF_PORT:-8080}"
      MKEF_JOB_TIMEOUT_SECONDS: "${MKEF_JOB_TIMEOUT_SECONDS:-1800}"
      MKEF_JOB_TTL_SECONDS: "${MKEF_JOB_TTL_SECONDS:-86400}"
      MKEF_MAX_ACTIVE_JOBS: "${MKEF_MAX_ACTIVE_JOBS:-20}"
      MKEF_MAX_CASE_BYTES: "${MKEF_MAX_CASE_BYTES:-10485760}"
      MKEF_MAX_RESULT_BYTES: "${MKEF_MAX_RESULT_BYTES:-104857600}"
      MKEF_MAX_LOG_BYTES: "${MKEF_MAX_LOG_BYTES:-262144}"
    expose:
      - "8000"
    networks:
      - solver_internal
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=0700
      - /jobs:rw,noexec,nosuid,size=1g,uid=10001,gid=10001,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    cpus: "${MKEF_SOLVER_CPUS:-2.0}"
    mem_limit: "${MKEF_SOLVER_MEMORY:-4g}"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    image: denisovds/mkef-web:0.8.2
    pull_policy: always
    depends_on:
      solver:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MKEF_PORT:-8080}:8080"
    networks:
      - public
      - solver_internal
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,uid=101,gid=101,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/preprocessor/"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  public:
  solver_internal:
    internal: true
