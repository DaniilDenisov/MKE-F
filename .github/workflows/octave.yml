name: GNU Octave

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install GNU Octave
        run: |
          sudo apt-get update
          sudo apt-get install --yes octave
          octave --version

      - name: Run headless verification suite
        run: octave --no-gui --quiet --eval "addpath(pwd); run_octave_tests;"
