<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="title">
<title id="title">Beam with two frame elements: fixed node 1, pinned node 2, free node 3</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#285b89"/></marker></defs>
<style>text{font:16px 'Segoe UI',Arial,sans-serif;fill:#17211b} .bar{stroke:#165c45;stroke-width:7;fill:none} .thin{stroke:#5d685f;stroke-width:2;fill:none} .arrow{stroke:#285b89;stroke-width:2;fill:none;marker-end:url(#arrow)} .node{fill:#fff;stroke:#165c45;stroke-width:3}</style>
<rect width="640" height="260" fill="#fbfaf5"/>
<path class="arrow" d="M35 85 V30"/><path class="arrow" d="M35 85 H90"/><text x="15" y="25">Y</text><text x="95" y="90">X</text><path class="thin" d="M130 70 V150 M130 75 l-15 15 M130 95 l-15 15 M130 115 l-15 15 M130 135 l-15 15"/>
<path class="bar" d="M130 110 H550"/>
