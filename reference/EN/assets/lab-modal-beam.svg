<path class="thin" d="M340 118 l-20 30 h40 Z M310 150 H370 M315 150 l-8 10 M330 150 l-8 10 M345 150 l-8 10 M360 150 l-8 10"/>
<text x="125" y="90">1</text><text x="335" y="90">2</text><text x="545" y="90">3</text>
<text x="220" y="140">1 m</text><text x="440" y="140">1 m</text>
<text x="85" y="195">u₁x = u₁y = θ₁ = 0</text><text x="285" y="225">u₂x = u₂y = 0</text>
<text x="305" y="195">θ₂ free</text><text x="485" y="195">u₃x, u₃y, θ₃</text>
